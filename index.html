<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Sun Power BD | Solar &amp; Electrical Products in Bangladesh</title>
    <meta
      name="description"
      content="Rising Sun Power BD — solar panels, inverters, batteries, MCB/MCCB, cables and accessories delivered across Bangladesh. Free solar sizing calculator and instant quotations."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rsp-theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.setAttribute("data-theme", theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
