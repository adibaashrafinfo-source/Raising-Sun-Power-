<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Sun Power BD | Solar &amp; Electrical Products in Bangladesh</title>
    <meta
      name="description"
      content="Rising Sun Power BD supplies solar panels, inverters, batteries and electrical products in Bangladesh with solar installation, EPC and net metering support."
    />
    <meta
      name="keywords"
      content="Solar company Bangladesh, Solar panel supplier Bangladesh, Solar inverter Bangladesh, Solar EPC Bangladesh, Solar installation Bangladesh, Rooftop solar Bangladesh, Net metering Bangladesh, Solar products Dhaka, Solar supplier Chandpur, Solar installer Chandpur"
    />
    <script>
      // Every visit starts in light mode; a dark choice only lasts for that
      // browsing session, which is why this reads sessionStorage and ignores
      // the OS preference.
      (function () {
        try {
          var stored = sessionStorage.getItem("rsp-theme")
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light",
          )
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
