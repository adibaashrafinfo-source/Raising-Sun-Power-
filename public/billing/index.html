     +(gateUser?'<p class="hint" style="text-align:center;margin:10px 0 0">Username: <b style="font-size:16px;color:var(--ink)">'+esc(gateUser.u)+'</b></p>':'')
     +'<div class="gcode">'+esc(gateCode)+'</div><form data-form="code"><button class="btn primary gbtn" type="submit">I have saved it, continue</button></form>';
  }else if(m==='forgot'){
    h='<h1>Reset Admin password</h1><p class="hint">Enter the Admin username and the recovery code you saved.</p>'+msg+(w?'<div class="gmsg">Too many tries. Wait '+w+' seconds.</div>':'')
     +'<form data-form="forgot" autocomplete="off"><label class="f">Admin username<input class="in" name="u" required autocapitalize="none"></label>'
     +'<label class="f">Recovery code<input class="in" name="code" required autocapitalize="characters" placeholder="XXXX-XXXX-XXXX"></label>'
     +'<label class="f">New password (6 or more characters)<input class="in" type="password" name="p1" required autocomplete="new-password"></label>'
     +'<label class="f">Repeat new password<input class="in" type="password" name="p2" required autocomplete="new-password"></label>'+eye
     +'<button class="btn primary gbtn" type="submit">Set new password</button></form><p class="hint" style="margin-top:12px"><a href="#" data-act="auth-mode" data-m="login">Back to sign in</a></p>'
     +(inCl()?'<p class="hint" style="margin-top:6px"><a href="#" data-act="auth-mode" data-m="owner">No recovery code either? Use a reset code from Claude</a></p>':'');
  }else if(m==='owner'){
    h='<h1>Reset the login</h1><p class="hint">Forgot the username, the password and the recovery code? Ask Claude in your chat for a one-time reset code, then type it here. Your invoices, quotations, customers and catalog stay exactly as they are. Only the login is reset and you create a new Admin account.</p>'+msg
     +'<form data-form="owner" autocomplete="off"><label class="f">Reset code from Claude<input class="in" name="code" required autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX"></label>'
     +'<button class="btn primary gbtn" type="submit">Reset login</button></form>'
     +'<p class="hint" style="margin-top:12px">Works only inside the Claude app, and only with a code Claude created for you. Each code works once and expires.</p>'
     +'<p class="hint" style="margin-top:6px"><a href="#" data-act="auth-mode" data-m="login">Back to sign in</a></p>';
  }else{
    h='<h1>Sign in</h1><p class="hint">Rising Sun Power BD billing</p>'+msg+(w?'<div class="gmsg">Too many tries. Wait '+w+' seconds.</div>':'')
     +'<form data-form="login"><label class="f">Username<input class="in" name="u" required autocapitalize="none" autocomplete="username"></label>'
     +'<label class="f">Password<input class="in" type="password" name="p" required autocomplete="current-password"></label>'+eye
     +'<label class="hint" style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" name="keep"> Keep me signed in on this device for 7 days</label>'
     +'<button class="btn primary gbtn" type="submit">Sign in</button></form><p class="hint" style="margin-top:12px"><a href="#" data-act="auth-mode" data-m="forgot">Forgot the Admin password?</a></p>'
     +(inCl()?'<p class="hint" style="margin-top:6px"><a href="#" data-act="auth-mode" data-m="owner">Forgot the username too? Use a reset code from Claude</a></p>':'');
  }
  return '<div class="gcard"><div class="gbrand"><img src="'+LOGO+'" alt="Rising Sun Power BD logo"><b>Rising Sun Power BD</b></div>'+h+'</div>';
}
function showGate(){
  var g=$('#gate');document.body.classList.add('locked');g.hidden=false;g.innerHTML=gateHTML();
  var i=g.querySelector('input:not([type=checkbox])');if(i)try{i.focus()}catch(e){}
}
function enter(u,keep){
  amsg='';
  u.keep=!!keep;user=u;sessPut(u.u,keep);failSet({n:0,until:0});gateMsg='';gateCode='';gateUser=null;
  document.body.classList.remove('locked');$('#gate').hidden=true;$('#gate').innerHTML='';
  if(view.name==='settings'&&!isAdmin()){sdraft=null}
  render();window.scrollTo(0,0);
}
function lock(msg){amsg='';user=null;sessEnd();gateMode='login';gateMsg=msg||'';showGate()}
function signOut(){
  if(dirty&&!signArm){signArm=true;toast('You have unsaved changes. Tap Sign out again to leave anyway.',true);setTimeout(function(){signArm=false},4000);return}
  signArm=false;draft=null;dirty=false;panel=null;sdraft=null;view={name:'dashboard'};lock('You have been signed out.');
}
function authInit(){
  var u=window.__rspUser;
  if(!u){document.body.innerHTML='<p style="padding:24px;font:15px sans-serif">Open Billing from the admin panel.</p>';return false}
  user={u:u.u,name:u.name,role:u.role,keep:true};
  document.body.classList.remove('locked');var g=$('#gate');g.hidden=true;return true;
}
async function ownerReset(f){
  gateMode='owner';
  var bad=function(m){gateMsg=m;showGate()};
  var code=String((f.elements['code']||{}).value||'').replace(/[\s-]/g,'').toUpperCase();
  if(code.length<8)return bad('Enter the reset code Claude gave you.');
  if(++ownerTries>8)return bad('Too many tries. Close this page and open the app again.');
  var db=cloud.db;
  if(!db){try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}}
  if(!db)return bad('This page is not connected to your Claude account, so a reset code cannot be checked here. Open the app from your Claude chat.');
  var d=null;
  try{var snap=await db.doc('config/reset').get();d=snap&&snap.exists?snap.data():null}catch(e){return bad('Could not reach your Claude account. Check the internet and try again.')}
  if(!d||!d.s||!d.h||!(Number(d.exp)>Date.now())||hashPw(code,String(d.s))!==d.h)return bad('That reset code is not valid or has expired. Ask Claude for a new one.');
  var burnt=false;   /* a code works once: use it up first, and refuse if that cannot be done */
  try{await db.doc('config/reset').delete();burnt=true}catch(e){try{await db.doc('config/reset').set({used:Date.now()});burnt=true}catch(e2){}}
  if(!burnt)return bad('The code is correct, but it could not be used up because this view cannot write. Open the app from your own Claude account and try again.');
  try{localStorage.removeItem(AK);localStorage.removeItem(FK)}catch(e){}
  sessEnd();memAuth=null;user=null;ownerTries=0;
  gateMode='setup';gateMsg='Login reset. Create a new Admin account now. Your invoices, quotations, customers and catalog were not touched.';showGate();
}
function authForm(kind,f){
  if(kind==='owner'){ownerReset(f);return}
  var v=function(n){var e=f.elements[n];return e?(e.type==='checkbox'?e.checked:e.value):''},a=aget();
  var bad=function(m){gateMsg=m;showGate()};
  if(kind==='setup'){
    var u=v('u').trim().toLowerCase(),nm=v('name').trim();
    if(!nm)return bad('Enter your name.');
    if(!/^[a-z0-9._-]{3,}$/.test(u))return bad('Username needs 3 or more letters, numbers, dot, dash or underscore.');
    if(v('p1').length<6)return bad('Password must be at least 6 characters.');
    if(v('p1')!==v('p2'))return bad('The two passwords do not match.');
    var code=newCode(),ad=mkUser(nm,u,v('p1'),'admin');
    aput({users:[ad],rec:mkRec(code)});gateUser=ad;gateCode=code;gateMode='code';gateMsg='';showGate();return;
  }
  if(kind==='code'){var gu=gateUser;if(gu)enter(gu,false);return}
  if(kind==='login'){
    if(waitLeft()){gateMsg='';showGate();return}
    var x=findU(a,v('u'));
    if(x&&okPw(x,v('p'))){enter(x,v('keep'));return}
    failHit();bad(waitLeft()?'':'Wrong username or password.');return;
  }
  if(kind==='forgot'){
    if(waitLeft()){gateMsg='';gateMode='forgot';showGate();return}
    var ax=findU(a,v('u'));
    var c2=v('code').replace(/[\s-]/g,'').toUpperCase();
    if(!ax||ax.role!=='admin'||!a.rec||hashPw(c2,a.rec.salt)!==a.rec.hash){failHit();return bad('Username or recovery code is not correct.')}
    if(v('p1').length<6)return bad('Password must be at least 6 characters.');
    if(v('p1')!==v('p2'))return bad('The two passwords do not match.');
    var salt=hex(rnd(16));ax.salt=salt;ax.hash=hashPw(v('p1'),salt);
    var nc=newCode();a.rec=mkRec(nc);aput(a);gateUser=ax;gateCode=nc;gateMode='code';gateMsg='Password changed. Here is your new recovery code. The old one no longer works.';showGate();
  }
}
function accountHTML(){
  var a=aget(),me=user,h='<div class="panel"><div class="ph"><h2>My account</h2></div><p class="hint" style="margin-top:0">Signed in as <b>'+esc(me.name)+'</b> ('+esc(me.u)+', '+(me.role==='admin'?'Admin':'Staff')+')</p>'
   +(amsg?'<div class="gmsg'+(/^(Password (changed|set)|User added|Removed)/.test(amsg)?' ok':'')+'" role="status">'+esc(amsg)+'</div>':'')
   +'<div class="g3"><label class="f">Current password<input class="in" type="password" id="pw0" autocomplete="current-password"></label><label class="f">New password<input class="in" type="password" id="pw1" autocomplete="new-password"></label><label class="f">Repeat new password<input class="in" type="password" id="pw2" autocomplete="new-password"></label></div>'
   +'<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="auth-chpw">Change my password</button><button class="btn" data-act="auth-out">Sign out</button></div></div>';
  if(me.role==='admin'){
    h+='<div class="panel"><div class="ph"><h2>Users</h2></div><p class="hint" style="margin-top:0">Admin can do everything. Staff can create and edit invoices, quotations and customers, but cannot delete, change settings, edit the catalog or restore backups.</p>'
     +'<div class="ulist">'+a.users.map(function(x){
        return '<div class="urow" data-u="'+esc(x.u)+'"><div class="un"><b>'+esc(x.name)+'</b><span class="hint">'+esc(x.u)+' · '+(x.role==='admin'?'Admin':'Staff')+(x.u===me.u?' · you':'')+'</span></div>'
         +'<input class="in" type="password" placeholder="New password" autocomplete="new-password" aria-label="New password for '+esc(x.name)+'">'
         +'<button class="btn" data-act="auth-reset">Set password</button>'
         +(x.u===me.u?'':'<button class="btn danger" data-act="auth-remove">Remove</button>')+'</div>'}).join('')+'</div>'
     +'<h3 style="margin:18px 0 8px;font-size:14px">Add a user</h3><div class="g4"><label class="f">Name<input class="in" id="nu-name"></label><label class="f">Username<input class="in" id="nu-u" autocapitalize="none"></label><label class="f">Password<input class="in" type="password" id="nu-p" autocomplete="new-password"></label><label class="f">Role<select class="in" id="nu-r"><option value="staff">Staff</option><option value="admin">Admin</option></select></label></div>'
     +'<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="auth-add">Add user</button><button class="btn" data-act="auth-newcode">Make a new recovery code</button></div></div>';
  }
  return h;
}
function authAct(a,t){
  var me=user,au=aget();
  if(a==='auth-eye'){var on=t.checked;document.querySelectorAll('#gate input[type=password],#gate input[data-pw]').forEach(function(i){i.type=on?'text':'password';i.setAttribute('data-pw','1')});return}
  if(a==='auth-mode'){gateMode=t.dataset.m;gateMsg='';showGate();return}
  if(a==='auth-out'){signOut();return}
  if(!me)return;
  var done=function(m){amsg=m;render()};
  if(a==='auth-chpw'){
    var x=findU(au,me.u),p0=$('#pw0').value,p1=$('#pw1').value,p2=$('#pw2').value;
    if(!okPw(x,p0))return done('Current password is not correct.');
    if(p1.length<6)return done('New password must be at least 6 characters.');
    if(p1!==p2)return done('The two new passwords do not match.');
    x.salt=hex(rnd(16));x.hash=hashPw(p1,x.salt);aput(au);return done('Password changed.');
  }
  if(me.role!=='admin')return;
  if(a==='auth-add'){
    var nm=$('#nu-name').value.trim(),u=$('#nu-u').value.trim().toLowerCase(),p=$('#nu-p').value,r=$('#nu-r').value;
    if(!nm)return done('Enter the name.');
    if(!/^[a-z0-9._-]{3,}$/.test(u))return done('Username needs 3 or more letters, numbers, dot, dash or underscore.');
    if(findU(au,u))return done('That username is already used.');
    if(p.length<6)return done('Password must be at least 6 characters.');
    au.users.push(mkUser(nm,u,p,r==='admin'?'admin':'staff'));aput(au);return done('User added: '+u);
  }
  var row=t.closest('.urow'),tu=row&&findU(au,row.dataset.u);
  if(a==='auth-reset'&&tu){
    var np=row.querySelector('input').value;
    if(np.length<6)return done('New password must be at least 6 characters.');
    tu.salt=hex(rnd(16));tu.hash=hashPw(np,tu.salt);aput(au);return done('Password set for '+tu.u+'.');
  }
  if(a==='auth-remove'&&tu){
    if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Confirm remove';setTimeout(function(){if(t.isConnected){t.classList.remove('armed');t.textContent='Remove'}},4000);return}
    au.users=au.users.filter(function(x){return x.u!==tu.u});aput(au);return done('Removed '+tu.u+'.');
  }
  if(a==='auth-newcode'){
    var c=newCode();au.rec=mkRec(c);aput(au);amsg='';
    $('#main').insertAdjacentHTML('afterbegin','<div class="panel"><div class="ph"><h2>New recovery code</h2></div><div class="gcode">'+esc(c)+'</div><p class="hint">Save it now. The old code no longer works. It is not shown again.</p></div>');
    window.scrollTo(0,0);return;
  }
}

document.addEventListener('click',function(e){var l=e.target.closest('a[data-act]');if(l)e.preventDefault()},true);
['click','keydown','touchstart','pointerdown'].forEach(function(ev){document.addEventListener(ev,function(){if(user)touch()},{passive:true,capture:true})});
setInterval(function(){
  if(user&&!user.keep&&Date.now()-lastAct>IDLE)lock('Signed out after 30 minutes of no activity.');
  else if(!user&&gateMode==='login'&&$('#gate')&&!$('#gate').hidden&&waitLeft()===0&&document.querySelector('#gate .gmsg')&&/Too many/.test(document.querySelector('#gate .gmsg').textContent)){var i=document.querySelector('#gate input[name=u]'),vv=i?i.value:'';gateMsg='';showGate();var j=document.querySelector('#gate input[name=u]');if(j)j.value=vv}
},5000);

/* ---------- boot ---------- */
try{var th=localStorage.getItem('rsp_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
if(!authInit())return;
(function(){
  try{var t=window.parent.document.documentElement.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  try{var v=new URLSearchParams(location.search).get('view');if(v&&['dashboard','invoices','quotes','finance','customers','catalog','settings'].indexOf(v)>=0&&(v!=='finance'||isAdmin()))view={name:v}}catch(e){}
})();
render();
initStore();
})();
</script>
