<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);font-family:Inter,system-ui,sans-serif;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:var(--text);">Filters</span>
    <button onClick="{{ clear }}" style="border:0;background:transparent;color:var(--blue);font-family:Inter;font-size:12.5px;font-weight:600;cursor:pointer;">Clear all</button>
  </div>

  <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px;">Category</div>
  <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:18px;">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
      <button data-name="{{ c.name }}" onClick="{{ catClick }}" style="display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:8px 6px;border-radius:9px;cursor:pointer;text-align:left;transition:background .18s;" style-hover="background:var(--surface-2);">
        <span style="width:19px;height:19px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid {{ c.boxBorder }};background:{{ c.boxBg }};transition:all .18s;"><sc-if value="{{ c.active }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span>
        <span style="flex:1;font-size:13.5px;font-weight:500;color:var(--text);">{{ c.name }}</span>
        <span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;">{{ c.count }}</span>
      </button>
    </sc-for>
  </div>

  <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px;">Brand</div>
  <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:18px;">
    <sc-for list="{{ brands }}" as="b" hint-placeholder-count="6">
      <button data-name="{{ b.name }}" onClick="{{ brandClick }}" style="display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:8px 6px;border-radius:9px;cursor:pointer;text-align:left;transition:background .18s;" style-hover="background:var(--surface-2);">
        <span style="width:19px;height:19px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid {{ b.boxBorder }};background:{{ b.boxBg }};transition:all .18s;"><sc-if value="{{ b.active }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span>
        <span style="flex:1;font-size:13.5px;font-weight:500;color:var(--text);">{{ b.name }}</span>
      </button>
    </sc-for>
  </div>

  <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px;">Max price</div>
  <div style="margin-bottom:6px;">
    <input type="range" min="500" max="100000" step="500" value="{{ priceMax }}" onInput="{{ onPrice }}" style="width:100%;accent-color:#F49E09;cursor:pointer;" />
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;"><span>৳500</span><span style="font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;">{{ priceMaxStr }}</span></div>
  </div>

  <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px;">
    <button onClick="{{ onToggleStock }}" style="display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:4px 2px;cursor:pointer;text-align:left;">
      <span style="width:40px;height:23px;border-radius:999px;flex-shrink:0;background:{{ stockTrack }};position:relative;transition:background .2s;"><span style="position:absolute;top:2px;left:{{ stockKnob }};width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:left .2s;"></span></span>
      <span style="flex:1;font-size:13.5px;font-weight:500;color:var(--text);">In stock only</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:600},&quot;catOpts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;brandOpts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;priceMax&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;inStock&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleCat&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:string)=&gt;void&quot;},&quot;onToggleBrand&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:string)=&gt;void&quot;},&quot;onPrice&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onToggleInStock&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props;
    const dec=(list)=>(list||[]).map(x=>({ ...x, boxBorder:x.active?"#F49E09":"var(--border)", boxBg:x.active?"linear-gradient(135deg,#F49E09,#FFB43D)":"transparent" }));
    const cap=100000, val=p.priceMax==null?cap:p.priceMax;
    return {
      cats:dec(p.catOpts), brands:dec(p.brandOpts),
      priceMax:val, priceMaxStr: val>=cap ? "৳100,000+" : ("৳"+Number(val).toLocaleString("en-US")),
      stockTrack: p.inStock?"linear-gradient(100deg,#67A70E,#4C9412)":"var(--surface-3)",
      stockKnob: p.inStock?"19px":"2px",
      catClick:(e)=>p.onToggleCat&&p.onToggleCat(e.currentTarget.dataset.name),
      brandClick:(e)=>p.onToggleBrand&&p.onToggleBrand(e.currentTarget.dataset.name),
      onPrice:(e)=>p.onPrice&&p.onPrice(e),
      onToggleStock:()=>p.onToggleInStock&&p.onToggleInStock(),
      clear:()=>p.onClear&&p.onClear(),
    };
  }
}
</script>
</body>
</html>
